name: Client Quality

on:
  push:
    paths:
      - 'client/**'
      - '.github/workflows/client-build.yml'
  pull_request:
    paths:
      - 'client/**'
      - '.github/workflows/client-build.yml'

jobs:
  client-quality:
    name: Client Quality Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run client lint command
        run: npm run lint

      - name: Run client test command
        run: npm run test

      - name: Build client app
        run: npm run build
